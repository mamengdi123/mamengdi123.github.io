<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小州弱网 - 验证中心</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            background: #020105;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* --- 主容器 (整体缩小版，确保上下边框可见) --- */
        .glass-card {
            position: relative;
            width: 82%;
            max-width: 340px;
            padding: 28px 22px 22px;
            background: rgba(255, 255, 255, 0.04); 
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 22px;
            text-align: center;
            
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 
                0 0 30px rgba(176, 102, 255, 0.2),
                0 25px 50px -12px rgba(0, 0, 0, 0.9),
                inset 0 1px 1px rgba(255, 255, 255, 0.5),
                inset 0 -1px 1px rgba(255, 255, 255, 0.1); 
        }

        /* --- 动态流光边框 --- */
        .glass-card::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 24px;
            padding: 2px;
            background: linear-gradient(120deg, transparent 0%, rgba(176, 102, 255, 0.3) 30%, rgba(224, 170, 255, 1) 50%, rgba(176, 102, 255, 0.3) 70%, transparent 100%);
            background-size: 200% 200%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: liquid-flow 4s linear infinite;
            z-index: -1;
            opacity: 0.9;
            filter: drop-shadow(0 0 5px rgba(176, 102, 255, 0.5));
        }
        @keyframes liquid-flow { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* --- 四角能量节点 --- */
        .corner { position: absolute; width: 10px; height: 10px; background: radial-gradient(circle, #fff 0%, #c77dff 40%, transparent 80%); border-radius: 50%; box-shadow: 0 0 10px #c77dff, 0 0 20px #7b2cbf; z-index: 2; animation: corner-breathe 3s ease-in-out infinite; }
        .tl { top: -5px; left: -5px; } .tr { top: -5px; right: -5px; animation-delay: 0.75s; }
        .bl { bottom: -5px; left: -5px; animation-delay: 1.5s; } .br { bottom: -5px; right: -5px; animation-delay: 2.25s; }
        @keyframes corner-breathe { 0%, 100% { transform: scale(0.8); opacity: 0.5; } 50% { transform: scale(1.2); opacity: 1; filter: brightness(1.5); } }

        /* --- 标题与文案 (间距全面压缩) --- */
        .main-title { font-size: 1.8rem; font-weight: 800; color: #fff; text-shadow: 0 0 20px rgba(255, 255, 255, 0.6), 0 0 40px rgba(176, 102, 255, 0.4); margin-bottom: 2px; letter-spacing: 2px; }
        .sub-title { font-size: 0.65rem; color: rgba(255,255,255,0.5); letter-spacing: 5px; margin-bottom: 18px; font-weight: 300; text-transform: uppercase; }
        .feature-text { color: #e0aaff; font-size: 0.95rem; font-weight: bold; margin-bottom: 4px; text-shadow: 0 0 10px rgba(197, 138, 255, 0.6); }
        .desc-text { font-size: 0.7rem; color: rgba(255,255,255,0.4); margin-bottom: 16px; }

        /* --- 图标区域 (缩小) --- */
        .icon-box { width: 65px; height: 65px; margin: 0 auto 18px; background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02)); border-radius: 18px; border: 1px solid rgba(255,255,255,0.2); display: flex; justify-content: center; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.05); position: relative; overflow: hidden; }
        .icon-box::after { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent); transform: rotate(45deg); animation: shine-sweep 4s infinite; }
        @keyframes shine-sweep { 0% { transform: translateX(-100%) rotate(45deg); } 100% { transform: translateX(100%) rotate(45deg); } }
        .icon-text { font-size: 10px; color: #fff; font-weight: bold; z-index: 2; letter-spacing: 1px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

        /* --- 服务器压力监控面板 (间距压缩) --- */
        .server-monitor { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; background: rgba(0, 0, 0, 0.2); padding: 12px 8px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); box-shadow: inset 0 2px 10px rgba(0,0,0,0.2); }
        .monitor-item { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .monitor-label { font-size: 0.55rem; color: rgba(255,255,255,0.4); letter-spacing: 1px; margin-bottom: 4px; }
        .monitor-value { font-size: 1rem; font-family: 'Courier New', monospace; font-weight: bold; color: #d4aaff; text-shadow: 0 0 8px rgba(176, 102, 255, 0.5); }

        /* --- 动态切换区域 --- */
        .dynamic-area { min-height: 120px; display: flex; flex-direction: column; justify-content: center; transition: all 0.5s ease; }

        /* 状态1：登录表单 */
        .login-form { display: flex; flex-direction: column; gap: 10px; width: 100%; transition: opacity 0.3s; }
        .tech-input { width: 100%; padding: 12px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px; color: #fff; text-align: center; font-size: 0.9rem; transition: all 0.3s ease; box-shadow: inset 0 2px 5px rgba(0,0,0,0.2); }
        .tech-input:focus { border-color: rgba(224, 170, 255, 0.6); box-shadow: 0 0 15px rgba(224, 170, 255, 0.3), inset 0 0 10px rgba(224, 170, 255, 0.1); background: rgba(0, 0, 0, 0.5); }
        .tech-input::placeholder { color: rgba(255,255,255,0.3); font-size: 0.8rem; }

        /* 状态2：防封监控 */
        .security-panel { display: none; background: rgba(0, 255, 100, 0.05); border: 1px solid rgba(0, 255, 100, 0.3); border-radius: 14px; padding: 14px; flex-direction: column; gap: 10px; animation: fade-in-up 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; backdrop-filter: blur(10px); box-shadow: 0 0 20px rgba(0, 255, 100, 0.1); }
        @keyframes fade-in-up { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .status-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: #eee; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px; }
        .status-row:last-child { border-bottom: none; padding-bottom: 0; }
        .status-label { display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #00ff88; box-shadow: 0 0 10px #00ff88; animation: pulse-green 1.5s infinite; }
        @keyframes pulse-green { 0% { opacity: 0.4; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 15px #00ff88; } 100% { opacity: 0.4; transform: scale(0.8); } }
        .status-text-val { font-family: monospace; font-weight: bold; color: #00ff88; text-shadow: 0 0 5px rgba(0, 255, 136, 0.5); }

        /* --- 按钮样式 (高度压缩) --- */
        .action-btn { width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.25); color: #e0aaff; font-size: 0.95rem; border-radius: 50px; cursor: pointer; transition: all 0.3s; margin-top: 10px; font-weight: 600; letter-spacing: 1px; position: relative; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .action-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent); transition: 0.6s; }
        .action-btn:hover::before { left: 100%; }
        .action-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: #e0aaff; box-shadow: 0 0 25px rgba(176, 102, 255, 0.4); transform: translateY(-2px); }
        .action-btn:active { transform: scale(0.96); }

        .enter-btn { display: none; background: rgba(0, 255, 100, 0.1); border: 1px solid rgba(0, 255, 100, 0.4); color: #fff; box-shadow: 0 0 20px rgba(0, 255, 100, 0.2); margin-top: 12px; }
        .enter-btn:hover { background: rgba(0, 255, 100, 0.2); box-shadow: 0 0 30px rgba(0, 255, 100, 0.4); }

        .footer { font-size: 0.6rem; color: rgba(255,255,255,0.2); margin-top: 15px; }
    </style>
</head>
<body>

    <div class="glass-card">
        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>

        <h1 class="main-title">小州弱网</h1>
        <div class="sub-title">XIAO ZHOU</div>

        <div class="icon-box"><span class="icon-text">⚡ 小州弱网</span></div>

        <div class="feature-text">全网独家 AI端循环处理</div>
        <div class="desc-text">预防所有封号检测和人脸</div>

        <div class="server-monitor">
            <div class="monitor-item">
                <div class="monitor-label">CPU 负载</div>
                <div class="monitor-value" id="cpu-val">35%</div>
            </div>
            <div class="monitor-item">
                <div class="monitor-label">内存占用</div>
                <div class="monitor-value" id="ram-val">52%</div>
            </div>
            <div class="monitor-item">
                <div class="monitor-label">网络延迟</div>
                <div class="monitor-value" id="ping-val" style="color:#00ff88;">20ms</div>
            </div>
        </div>

        <div class="dynamic-area">
            <div class="login-form" id="loginForm">
                <input type="text" id="username" class="tech-input" value="xznb" placeholder="请输入卡密/账号">
                <input type="password" id="password" class="tech-input" value="xznb" placeholder="请输入密码">
                <button class="action-btn" onclick="startVerification()">立即验证</button>
            </div>

            <div class="security-panel" id="securityPanel">
                <div class="status-row">
                    <div class="status-label"><div class="status-dot"></div>人脸拦截系统</div>
                    <div class="status-text-val">运行中</div>
                </div>
                <div class="status-row">
                    <div class="status-label"><div class="status-dot"></div>封号检测防御</div>
                    <div class="status-text-val">已激活</div>
                </div>
                <div class="status-row">
                    <div class="status-label"><div class="status-dot"></div>设备环境伪装</div>
                    <div class="status-text-val">安全</div>
                </div>
            </div>
        </div>

        <button class="action-btn enter-btn" id="enterBtn" onclick="enterSystem()">已进入系统</button>
        <div class="footer">© 2026 小州弱网</div>
    </div>

    <script>
        function startVerification() {
            const loginForm = document.getElementById('loginForm');
            const securityPanel = document.getElementById('securityPanel');
            const enterBtn = document.getElementById('enterBtn');
            const btn = loginForm.querySelector('.action-btn');

            btn.innerText = "正在注入防封协议...";
            btn.style.pointerEvents = "none";
            btn.style.opacity = "0.7";

            setTimeout(() => {
                loginForm.style.display = 'none';
                securityPanel.style.display = 'flex';
                enterBtn.style.display = 'block';
            }, 1500);
        }

        function enterSystem() {
            const btn = document.getElementById('enterBtn');
            btn.innerText = "正在连接服务器...";
            setTimeout(() => {
                alert("✅ 环境安全，正在进入游戏...");
                btn.innerText = "已进入系统";
            }, 1000);
        }

        function updateServerStats() {
            const cpu = Math.floor(Math.random() * 10) + 30;
            document.getElementById('cpu-val').innerText = cpu + '%';
            const ram = Math.floor(Math.random() * 5) + 50;
            document.getElementById('ram-val').innerText = ram + '%';
            const ping = Math.floor(Math.random() * 5) + 18;
            document.getElementById('ping-val').innerText = ping + 'ms';
        }
        setInterval(updateServerStats, 2000);
        updateServerStats();
    </script>
</body>
</html>
